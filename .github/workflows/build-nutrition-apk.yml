name: Build Nutrition APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up HA build environment
        uses: ./.github/actions/setup-build-env
        with:
          mock-google-services: "true"

      - name: Build Full Debug APK
        run: ./gradlew :app:assembleFullDebug -PnoStrictMode

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-full-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
