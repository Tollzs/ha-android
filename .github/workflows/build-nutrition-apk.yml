name: Build Nutrition APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin
        run: |
          ./gradlew :app:compileFullDebugKotlin \
            -PnoStrictMode \
            --stacktrace \
            --info \
            --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-full-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
