name: Build Nutrition APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Install persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build APK
        run: |
          ./gradlew :app:assembleFullDebug \
            -x :app:processFullDebugGoogleServices \
            -PnoStrictMode \
            --stacktrace \
            --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-full-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
